# Add these locations inside the existing calender.aido.co.zw server block.
# Keep the application's existing /admin, /t, /calendar and legal route handlers.

location = / {
    root /var/www/calenderzw/public;
    try_files /index.html =404;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=300" always;
}

location = /index.html {
    root /var/www/calenderzw/public;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "public, max-age=300" always;
}
