name: P0-A formatting finalizer

on:
  push:
    branches:
      - p0-a-public-timetable-tomorrow-trust
    paths:
      - .github/workflows/p0a-format-artifact.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p0-a-public-timetable-tomorrow-trust
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format P0-A files
        run: |
          npx prettier --write \
            src/components/site/SiteChrome.tsx \
            src/domain/tomorrowSchedule.ts \
            src/PublicTimetableReliability.tsx \
            tests/PublicTimetableReliability.test.tsx
      - name: Verify full gate before committing
        run: |
          npm run lint
          npm run format:check
          npm run test
          npm run build
      - name: Commit formatting and remove temporary finalizer
        run: |
          rm .github/workflows/p0a-format-artifact.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/site/SiteChrome.tsx src/domain/tomorrowSchedule.ts src/PublicTimetableReliability.tsx tests/PublicTimetableReliability.test.tsx .github/workflows/p0a-format-artifact.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(P0-A): finalize verified formatting"
          git push origin HEAD:p0-a-public-timetable-tomorrow-trust
