name: DR-59 Wire Theme

on:
  push:
    branches:
      - DR-59-dashboard-theme-system

permissions:
  contents: write

jobs:
  wire-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DR-59-dashboard-theme-system
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wire shared dashboard theme
        run: python scripts/dr59-wire-theme.py
      - name: Format changed files
        run: npx prettier --write index.html src/AppV2.tsx src/main.tsx src/dashboardTheme.tsx src/dashboardThemeContract.ts src/dashboardTheme.css src/classRepCorrectionSafetyEnhancement.css tests/dashboardTheme.test.ts tests/dashboardThemeSurface.test.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - name: Commit verified DR-59 wiring
        run: |
          if git diff --quiet; then
            echo "No wiring changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/AppV2.tsx src/main.tsx src/dashboardTheme.tsx src/dashboardThemeContract.ts src/dashboardTheme.css src/classRepCorrectionSafetyEnhancement.css tests/dashboardTheme.test.ts tests/dashboardThemeSurface.test.ts
          git commit -m "feat: wire persistent complete dashboard theming"
          git push origin HEAD:DR-59-dashboard-theme-system
