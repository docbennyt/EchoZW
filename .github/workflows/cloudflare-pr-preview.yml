name: Cloudflare PR Verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-worker:
    name: Verify Worker candidate without secrets
    runs-on: ubuntu-latest
    services:
      delivery-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dr178
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 15478:5432
        options: >-
          --health-cmd "pg_isready -U dr178 -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DR178_PG_MODULE: ${{ github.workspace }}/node_modules/pg/lib/index.js
      DR178_REQUIRE_POSTGRES: "true"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run worker:check
      - run: npm run worker:automation:check
      - run: npm run worker:validate
