name: Cloudflare PR Verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-worker:
    name: Verify Worker candidate without secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run worker:check
      - run: npm run worker:automation:check
      - run: npm run worker:validate
