name: Cloudflare Exact-Head Preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  preview:
    name: Verify, deploy and smoke exact PR head
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CALENDERZW_STAGING_ORIGIN: https://next.calender.aido.co.zw
      CALENDERZW_STAGING_FEED_URL: ${{ secrets.CALENDERZW_STAGING_FEED_URL }}
      EXPECTED_BACKEND_SHA: ${{ vars.EXPECTED_BACKEND_SHA }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      IS_SAME_REPO_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PR_HEAD_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Confirm exact head
        id: exact-head
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          echo "pr_head_sha=${PR_HEAD_SHA}"
          echo "checked_out_sha=${checked_out_sha}"
          test "${checked_out_sha}" = "${PR_HEAD_SHA}"
          echo "sha=${checked_out_sha}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Cloudflare foundation check
        run: npm run worker:check

      - name: Wrangler dry-run validation
        run: npx wrangler@4.147.0 deploy --env staging --config wrangler.jsonc --dry-run --outdir .wrangler-dry-run --var SOURCE_SHA:${{ steps.exact-head.outputs.sha }}

      - name: Deploy Cloudflare staging
        id: deploy
        if: ${{ env.IS_SAME_REPO_PR == 'true' }}
        run: |
          npx wrangler@4.147.0 deploy \
            --env staging \
            --config wrangler.jsonc \
            --var SOURCE_SHA:${{ steps.exact-head.outputs.sha }} \
            --tag sha-${{ steps.exact-head.outputs.sha }} \
            --message "PR ${{ github.event.pull_request.number }} ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Live staging smoke
        if: ${{ env.IS_SAME_REPO_PR == 'true' }}
        run: npm run worker:smoke:staging
        env:
          EXPECTED_RELEASE_SHA: ${{ steps.exact-head.outputs.sha }}

      - name: Read deployed release identity
        id: release
        if: ${{ env.IS_SAME_REPO_PR == 'true' }}
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          const response = await fetch(`${process.env.CALENDERZW_STAGING_ORIGIN}/__release`, {
            headers: { Accept: "application/json" },
          });
          const release = await response.json();
          console.log(`worker_version=${release.workerVersion ?? ""}`);
          console.log(`source_sha=${release.sourceSha ?? ""}`);
          NODE

      - name: Evidence summary
        if: ${{ always() }}
        run: |
          {
            echo "## Cloudflare exact-head preview"
            echo
            echo "- Pull request: #${{ github.event.pull_request.number }}"
            echo "- Exact PR head SHA: \`${{ steps.exact-head.outputs.sha }}\`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Staging origin: ${CALENDERZW_STAGING_ORIGIN}"
            if [ "${IS_SAME_REPO_PR}" = "true" ]; then
              echo "- Deploy: attempted with Cloudflare staging environment"
              echo "- Worker version: \`${{ steps.release.outputs.worker_version }}\`"
              echo "- Smoke: required and completed before this summary step"
              if [ -n "${EXPECTED_BACKEND_SHA}" ]; then
                echo "- Backend integration: required Railway/backend SHA \`${EXPECTED_BACKEND_SHA}\`"
              else
                echo "- Backend integration: release identity is reported when available; same-SHA Railway compatibility is not implied by this Worker preview"
              fi
            else
              echo "- Deploy: skipped because this PR is not from the base repository"
              echo "- Smoke: skipped with deploy"
            fi
            echo "- Production DNS: unchanged"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview evidence on PR
        if: ${{ env.IS_SAME_REPO_PR == 'true' && always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/cloudflare-preview.md <<EOF
          Cloudflare exact-head preview evidence

          - Exact PR head SHA: \`${{ steps.exact-head.outputs.sha }}\`
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Staging origin: ${CALENDERZW_STAGING_ORIGIN}
          - Worker version: \`${{ steps.release.outputs.worker_version }}\`
          - Source SHA reported by /__release: \`${{ steps.release.outputs.source_sha }}\`
          - Production DNS/runtime unchanged.
          - Backend compatibility: this Worker preview does not imply same-SHA Railway backend compatibility unless \`EXPECTED_BACKEND_SHA\` is configured and enforced.

          This workflow checks out the immutable PR head SHA, verifies the repository, deploys Cloudflare staging with \`SOURCE_SHA\`, and runs the live staging smoke before reporting evidence.
          EOF
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/cloudflare-preview.md
