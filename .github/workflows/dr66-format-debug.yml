name: DR66 format debug

on:
  push:
    branches:
      - drbenitsolutions/dr-66-responsive-finder-ux

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/HeroTrustProof.tsx tests/dr66FinderDiscoveryContract.test.ts
      - run: git diff -- src/HeroTrustProof.tsx tests/dr66FinderDiscoveryContract.test.ts
