name: DR66 desktop format debug

on:
  push:
    branches:
      - drbenitsolutions/dr-66-desktop-results-shell

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write tests/FinderDiscovery.test.tsx tests/dr66FinderDiscoveryContract.test.ts
      - run: git diff -- tests/FinderDiscovery.test.tsx tests/dr66FinderDiscoveryContract.test.ts
