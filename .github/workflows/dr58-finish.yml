name: DR-58 finish controls

on:
  push:
    branches: [DR-58-academic-pause-calendar]

permissions:
  contents: write

jobs:
  finish-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: DR-58-academic-pause-calendar
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wire DR-58 controls
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def patch(path, old, new, label):
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"{label}: expected anchor not found")
              file.write_text(text.replace(old, new, 1))

          path = Path("src/ClassRepCorrectionSafetyEnhancement.tsx")
          text = path.read_text()
          import_anchor = 'import { fetchPublicTimetable } from "./api/publicTimetable";\n'
          if 'from "./ClassRepAcademicPauseControl"' not in text:
              text = text.replace(import_anchor, import_anchor + 'import {\n  ActiveAcademicPauseNotice,\n  ClassRepAcademicPauseAction,\n} from "./ClassRepAcademicPauseControl";\n', 1)
          if '<ActiveAcademicPauseNotice' not in text:
              anchor = '      <div className="dr57-live-grid">\n'
              notice = '      <ActiveAcademicPauseNotice\n        accessToken={accessToken}\n        assignment={assignment}\n        timetable={timetable}\n        onRefresh={refresh}\n        onMessage={setMessage}\n      />\n\n'
              if anchor not in text:
                  raise SystemExit("Class Rep pause notice anchor missing")
              text = text.replace(anchor, notice + anchor, 1)
          if '<ClassRepAcademicPauseAction' not in text:
              action_bar = text.find('<div className="dr57-action-bar"')
              public_anchor = '        {assignment.publicSlug ? (\n'
              public_index = text.find(public_anchor, action_bar)
              if action_bar < 0 or public_index < 0:
                  raise SystemExit("Class Rep action bar anchor missing")
              action = '        <ClassRepAcademicPauseAction\n          accessToken={accessToken}\n          assignment={assignment}\n          timetable={timetable}\n          onRefresh={refresh}\n          onMessage={setMessage}\n        />\n'
              text = text[:public_index] + action + text[public_index:]
          path.write_text(text)

          patch(
              "server/academicPauseRepository.ts",
              'export async function listAcademicPausesForTimetable(timetableId: string) {',
              'export async function listAcademicPauses() {\n  const { data, error } = await client()\n    .from("academic_schedule_pauses")\n    .select("*")\n    .order("created_at", { ascending: false });\n  if (isMissingPauseSchema(error)) return [];\n  if (error) {\n    throw new AcademicPauseRepositoryError(\n      "DATABASE_UNAVAILABLE",\n      "Could not load academic pause rules.",\n      503,\n      error,\n    );\n  }\n  return (data ?? []).map((row) => mapPause(row as JsonRecord));\n}\n\nexport async function listAcademicPausesForTimetable(timetableId: string) {',
              "repository broad list",
          )

          path = Path("server/academicPauseAdminApi.ts")
          text = path.read_text()
          if '  listAcademicPauses,\n' not in text:
              text = text.replace('  listAcademicPausesForTimetable,\n', '  listAcademicPauses,\n  listAcademicPausesForTimetable,\n', 1)
          broad_get = '    if (\n      req.method === "GET" &&\n      url.pathname === "/api/admin/academic-pauses"\n    ) {\n      sendJson(res, 200, { pauses: await listAcademicPauses() });\n      return true;\n    }\n'
          if 'pauses: await listAcademicPauses()' not in text:
              anchor = '    if (\n      req.method === "POST" &&\n      url.pathname === "/api/admin/academic-pauses/preview"\n    ) {'
              if anchor not in text:
                  raise SystemExit("broad API anchor missing")
              text = text.replace(anchor, broad_get + anchor, 1)
          path.write_text(text)

          patch(
              "src/api/academicPauses.ts",
              'export function previewBroadPause(accessToken: string, input: BroadPauseInput) {',
              'export function listAcademicPauses(accessToken: string) {\n  return adminFetch<{ pauses: AdminAcademicSchedulePause[] }>(\n    "/api/admin/academic-pauses",\n    { accessToken },\n  );\n}\n\nexport function deactivateBroadPause(accessToken: string, pauseId: string) {\n  return adminFetch<{\n    pause: AdminAcademicSchedulePause;\n    googleCalendarSync: {\n      attempted: number;\n      succeeded: number;\n      failed: number;\n    };\n  }>(`/api/admin/academic-pauses/${encodeURIComponent(pauseId)}`, {\n    method: "DELETE",\n    accessToken,\n  });\n}\n\nexport function previewBroadPause(accessToken: string, input: BroadPauseInput) {',
              "browser broad pause client",
          )

          path = Path("src/FounderOperationsCockpit.tsx")
          text = path.read_text()
          if 'AdminAcademicPauseControl' not in text:
              text = text.replace('import { fetchAnalyticsOverview } from "./api/adminAnalytics";\n', 'import { fetchAnalyticsOverview } from "./api/adminAnalytics";\nimport { AdminAcademicPauseControl } from "./AdminAcademicPauseControl";\n', 1)
          old_types = 'import type { AdminTimetableSummary } from "./api/pilotTypes";'
          new_types = 'import type {\n  AdminClassGroup,\n  AdminInstitution,\n  AdminProgramme,\n  AdminTimetableSummary,\n} from "./api/pilotTypes";'
          if old_types in text:
              text = text.replace(old_types, new_types, 1)
          old_sig = 'export function FounderOperationsCockpit({\n  accessToken,\n  timetables,\n}: {\n  accessToken: string;\n  timetables: AdminTimetableSummary[];\n}) {'
          new_sig = 'export function FounderOperationsCockpit({\n  accessToken,\n  institutions,\n  programmes,\n  classGroups,\n  timetables,\n}: {\n  accessToken: string;\n  institutions: AdminInstitution[];\n  programmes: AdminProgramme[];\n  classGroups: AdminClassGroup[];\n  timetables: AdminTimetableSummary[];\n}) {'
          if new_sig not in text:
              if old_sig not in text:
                  raise SystemExit("Founder cockpit signature anchor missing")
              text = text.replace(old_sig, new_sig, 1)
          if '<AdminAcademicPauseControl' not in text:
              anchor = '      <section className="foc-section" aria-labelledby="pulse-heading">\n'
              control = '      <AdminAcademicPauseControl\n        accessToken={accessToken}\n        institutions={institutions}\n        programmes={programmes}\n        classGroups={classGroups}\n        timetables={timetables}\n      />\n\n'
              if anchor not in text:
                  raise SystemExit("Founder control mount anchor missing")
              text = text.replace(anchor, control + anchor, 1)
          path.write_text(text)

          path = Path("src/pilotMvp.tsx")
          text = path.read_text()
          old_overview = 'function AdminOverview({\n  accessToken,\n  timetables,\n}: {\n  accessToken: string;\n  timetables: AdminTimetableSummary[];\n}) {\n  return (\n    <FounderOperationsCockpit\n      accessToken={accessToken}\n      timetables={timetables}\n    />\n  );\n}'
          new_overview = 'function AdminOverview({\n  accessToken,\n  institutions,\n  programmes,\n  classGroups,\n  timetables,\n}: {\n  accessToken: string;\n  institutions: AdminInstitution[];\n  programmes: AdminProgramme[];\n  classGroups: AdminClassGroup[];\n  timetables: AdminTimetableSummary[];\n}) {\n  return (\n    <FounderOperationsCockpit\n      accessToken={accessToken}\n      institutions={institutions}\n      programmes={programmes}\n      classGroups={classGroups}\n      timetables={timetables}\n    />\n  );\n}'
          if new_overview not in text:
              if old_overview not in text:
                  raise SystemExit("AdminOverview signature anchor missing")
              text = text.replace(old_overview, new_overview, 1)
          old_call = '            <AdminOverview\n              accessToken={accessToken}\n              timetables={data.timetables}\n            />'
          new_call = '            <AdminOverview\n              accessToken={accessToken}\n              institutions={data.institutions}\n              programmes={data.programmes}\n              classGroups={data.classGroups}\n              timetables={data.timetables}\n            />'
          if new_call not in text:
              if old_call not in text:
                  raise SystemExit("AdminOverview call anchor missing")
              text = text.replace(old_call, new_call, 1)
          path.write_text(text)
          PY
      - name: Remove one-shot workflow before verification
        run: rm .github/workflows/dr58-finish.yml
      - name: Format DR-58 files
        run: npx prettier --write src/ClassRepAcademicPauseControl.tsx src/ClassRepCorrectionSafetyEnhancement.tsx src/AdminAcademicPauseControl.tsx src/classRepAcademicPauseControl.css src/FounderOperationsCockpit.tsx src/pilotMvp.tsx src/api/academicPauses.ts server/academicPauseAdminApi.ts server/academicPauseRepository.ts tests/academicPauseControls.test.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - name: Commit verified DR-58 controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finish DR-58 academic pause controls"
          git push origin HEAD:DR-58-academic-pause-calendar
