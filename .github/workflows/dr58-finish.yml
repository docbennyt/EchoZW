''')

          # 6. Mount broad control in Founder cockpit.
          path = repo / 'src/FounderOperationsCockpit.tsx'
          text = path.read_text()
          import_marker = 'import { fetchAnalyticsOverview } from "./api/adminAnalytics";\n'
          if 'AdminAcademicPauseControl' not in text:
              text = text.replace(import_marker, import_marker + 'import { AdminAcademicPauseControl } from "./AdminAcademicPauseControl";\n')
          text = text.replace(
              'import type { AdminTimetableSummary } from "./api/pilotTypes";',
              'import type {\n  AdminClassGroup,\n  AdminInstitution,\n  AdminProgramme,\n  AdminTimetableSummary,\n} from "./api/pilotTypes";',
          )
          old = '''export function FounderOperationsCockpit({\n  accessToken,\n  timetables,\n}: {\n  accessToken: string;\n  timetables: AdminTimetableSummary[];\n}) {'''
          new = '''export function FounderOperationsCockpit({\n  accessToken,\n  institutions,\n  programmes,\n  classGroups,\n  timetables,\n}: {\n  accessToken: string;\n  institutions: AdminInstitution[];\n  programmes: AdminProgramme[];\n  classGroups: AdminClassGroup[];\n  timetables: AdminTimetableSummary[];\n}) {'''
          text = text.replace(old, new)
          section_marker = '      <section className="foc-section" aria-labelledby="pulse-heading">\n'
          control = '''      <AdminAcademicPauseControl\n        accessToken={accessToken}\n        institutions={institutions}\n        programmes={programmes}\n        classGroups={classGroups}\n        timetables={timetables}\n      />\n\n'''
          if '<AdminAcademicPauseControl' not in text:
              text = text.replace(section_marker, control + section_marker)
          path.write_text(text)

          # 7. Pass loaded hierarchy into AdminOverview -> Founder cockpit.
          path = repo / 'src/pilotMvp.tsx'
          text = path.read_text()
          old = '''function AdminOverview({\n  accessToken,\n  timetables,\n}: {\n  accessToken: string;\n  timetables: AdminTimetableSummary[];\n}) {\n  return (\n    <FounderOperationsCockpit\n      accessToken={accessToken}\n      timetables={timetables}\n    />\n  );\n}'''
          new = '''function AdminOverview({\n  accessToken,\n  institutions,\n  programmes,\n  classGroups,\n  timetables,\n}: {\n  accessToken: string;\n  institutions: AdminInstitution[];\n  programmes: AdminProgramme[];\n  classGroups: AdminClassGroup[];\n  timetables: AdminTimetableSummary[];\n}) {\n  return (\n    <FounderOperationsCockpit\n      accessToken={accessToken}\n      institutions={institutions}\n      programmes={programmes}\n      classGroups={classGroups}\n      timetables={timetables}\n    />\n  );\n}'''
          if old not in text:
              raise SystemExit('AdminOverview signature changed; refusing unsafe patch')
          text = text.replace(old, new)
          old_call = '''            <AdminOverview\n              accessToken={accessToken}\n              timetables={data.timetables}\n            />'''
          new_call = '''            <AdminOverview\n              accessToken={accessToken}\n              institutions={data.institutions}\n              programmes={data.programmes}\n              classGroups={data.classGroups}\n              timetables={data.timetables}\n            />'''
          if old_call not in text:
              raise SystemExit('AdminOverview call changed; refusing unsafe patch')
          text = text.replace(old_call, new_call)
          path.write_text(text)

          # 8. Source-level boundary/integration regression coverage.
          (repo / 'tests/academicPauseControls.test.ts').write_text(r'''import { readFileSync } from "node:fs";
import { resolve } from "node:path";
import { describe, expect, it } from "vitest";

function source(path: string) {
  return readFileSync(resolve(process.cwd(), path), "utf8");
}

describe("DR-58 academic pause controls", () => {
  it("mounts pause controls into both Class Rep and Founder operational surfaces", () => {
    const classRep = source("src/ClassRepCorrectionSafetyEnhancement.tsx");
    const founder = source("src/FounderOperationsCockpit.tsx");
    expect(classRep).toContain("<ClassRepAcademicPauseAction");
    expect(classRep).toContain("<ActiveAcademicPauseNotice");
    expect(founder).toContain("<AdminAcademicPauseControl");
  });

  it("keeps broad pause routes behind operational-admin auth and scoped routes behind timetable-editor auth", () => {
    const routes = source("server/adminApi.ts");
    expect(routes).toContain("requireTimetableEditor(req, timetableId, deps)");
    expect(routes).toContain("requireOperationalAdmin(req, deps)");
    expect(routes).toContain('requestUrl.pathname.startsWith("/api/admin/academic-pauses")');
  });

  it("restricts Class Reps to their assigned timetable or session", () => {
    const repository = source("server/academicPauseRepository.ts");
    expect(repository).toContain('input.scopeType !== "timetable" && input.scopeType !== "session"');
    expect(repository).toContain("This timetable is not assigned to your Class Rep account.");
    expect(repository).toContain("Class Reps cannot resume institution or programme pauses.");
  });

  it("supports Admin listing and resuming broad pauses", () => {
    const api = source("server/academicPauseAdminApi.ts");
    const client = source("src/api/academicPauses.ts");
    expect(api).toContain("pauses: await listAcademicPauses()");
    expect(client).toContain("listAcademicPauses");
    expect(client).toContain("deactivateBroadPause");
  });
});
''')
          PY
      - name: Remove one-shot workflow before verification
