name: Cloudflare Reviewed Acceptance

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed PR head already uploaded by trusted staging
        required: true
        type: string
      pull_request:
        description: Pull request containing the reviewed candidate
        required: true
        type: string
      deployment_run:
        description: Completed Cloudflare Reviewed Staging run that uploaded it
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  authorize:
    if: github.ref == 'refs/heads/Calender'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact candidate approval and CI
        id: authorize
        run: node scripts/authorize-staging-candidate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_PR: ${{ inputs.pull_request }}

  acceptance:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Recheck exact approval after environment review
        run: node scripts/authorize-staging-candidate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.authorize.outputs.sha }}
          CANDIDATE_PR: ${{ inputs.pull_request }}
      - name: Recover immutable version from verified deployment provenance
        id: provenance
        run: node scripts/recover-reviewed-worker.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.authorize.outputs.sha }}
          DEPLOYMENT_RUN: ${{ inputs.deployment_run }}
      - name: Verify active version through Cloudflare API
        run: node scripts/verify-active-worker-deployment.mjs
        env:
          EXPECTED_WORKER_VERSION: ${{ steps.provenance.outputs.version }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify public SHA and version before releasing test credentials
        run: node scripts/verify-staging-identity.mjs
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          EXPECTED_WORKER_VERSION: ${{ steps.provenance.outputs.version }}
      - name: Authenticated and original-feed acceptance
        run: npm run worker:smoke:staging
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          EXPECTED_WORKER_VERSION: ${{ steps.provenance.outputs.version }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          CALENDERZW_STAGING_ADMIN_EMAIL: ${{ secrets.CALENDERZW_STAGING_ADMIN_EMAIL }}
          CALENDERZW_STAGING_ADMIN_PASSWORD: ${{ secrets.CALENDERZW_STAGING_ADMIN_PASSWORD }}
          CALENDERZW_STAGING_FEED_URL: ${{ secrets.CALENDERZW_STAGING_FEED_URL }}
          CALENDERZW_STAGING_FEED_TIMETABLE_SLUG: ${{ vars.CALENDERZW_STAGING_FEED_TIMETABLE_SLUG }}
      - run: npx playwright install --with-deps chromium
      - run: npm run browser:smoke:release
        env:
          CALENDERZW_BROWSER_SMOKE_BASE_URL: https://next.calender.aido.co.zw
      - name: Recheck active version after acceptance
        run: node scripts/verify-active-worker-deployment.mjs
        env:
          EXPECTED_WORKER_VERSION: ${{ steps.provenance.outputs.version }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
