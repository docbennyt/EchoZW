name: DR-161 Final Format Repair

on:
  push:
    branches:
      - DR-161-guided-import-flow

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DR-161-guided-import-flow
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/StaticTimetableImportPage.tsx tests/staticTimetableDocumentImport.test.ts tests/staticTimetableGuidedFlow.test.ts
      - name: Commit formatting and remove temporary workflow
        run: |
          rm .github/workflows/dr161-final-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(dr-161): format final guided flow fixes"
          git push origin HEAD:DR-161-guided-import-flow
