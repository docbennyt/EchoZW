name: DR-45 verified cockpit wiring

on:
  push:
    branches:
      - DR-45-founder-operations-cockpit

permissions:
  contents: write

jobs:
  wire-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: DR-45-founder-operations-cockpit
          fetch-depth: 0

      - name: Rebase onto current Calender
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin Calender
          git rebase origin/Calender

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Wire founder operations cockpit without replacing Team workspace
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pilot_path = Path("src/pilotMvp.tsx")
          pilot = pilot_path.read_text()

          import_line = 'import { FounderOperationsCockpit } from "./FounderOperationsCockpit";\n'
          if import_line not in pilot:
              anchor = 'import { fetchAnalyticsOverview } from "./api/adminAnalytics";\n'
              if anchor not in pilot:
                  raise SystemExit("admin analytics import anchor missing")
              pilot = pilot.replace(anchor, anchor + import_line, 1)

          if '<FounderOperationsCockpit' not in pilot:
              pattern = re.compile(
                  r'function AdminOverview\(\{.*?\n\}\n\n(?=function TeamPage\(\{)',
                  re.S,
              )
              replacement = '''function AdminOverview({
                accessToken,
                timetables,
              }: {
                accessToken: string;
                timetables: AdminTimetableSummary[];
              }) {
                return (
                  <FounderOperationsCockpit
                    accessToken={accessToken}
                    timetables={timetables}
                  />
                );
              }

              '''
              pilot, count = pattern.subn(replacement, pilot, count=1)
              if count != 1:
                  raise SystemExit(f"Expected one AdminOverview block, replaced {count}")

          if 'member.isFounder ? "Founder · Superadmin" : "Admin"' not in pilot:
              raise SystemExit("Team workspace founder protection was unexpectedly removed")
          if "!member.isFounder && canManageAdmins" not in pilot:
              raise SystemExit("Team workspace founder guard was unexpectedly removed")

          pilot_path.write_text(pilot)

          cockpit_test_path = Path("tests/founderOperationsCockpit.test.ts")
          cockpit_test = cockpit_test_path.read_text()
          compact_decl = 'const compactCockpit = cockpit.replace(/\\s+/g, " ");\n'
          styles_decl = 'const styles = readFileSync("src/founderOperationsCockpit.css", "utf8");\n'
          if compact_decl not in cockpit_test:
              if styles_decl not in cockpit_test:
                  raise SystemExit("cockpit test styles anchor missing")
              cockpit_test = cockpit_test.replace(
                  styles_decl,
                  styles_decl + compact_decl,
                  1,
              )
          cockpit_test = cockpit_test.replace(
              'expect(cockpit).toContain("Activation is update-enabled subscriptions divided by timetable viewers.");',
              'expect(compactCockpit).toContain("Activation is update-enabled subscriptions divided by timetable viewers.");',
              1,
          )
          cockpit_test_path.write_text(cockpit_test)

          app_test_path = Path("tests/App.test.tsx")
          app_test = app_test_path.read_text()
          old_shell_assertion = 'expect(screen.getByText(/Get a class timetable live/i)).toBeInTheDocument();'
          new_shell_assertion = 'expect(screen.getByText(/Know what needs attention before opening CRUD/i)).toBeInTheDocument();'
          if old_shell_assertion in app_test:
              app_test = app_test.replace(old_shell_assertion, new_shell_assertion, 1)
          elif new_shell_assertion not in app_test:
              raise SystemExit("admin shell assertion anchor missing")
          app_test_path.write_text(app_test)

          reliability_test_path = Path("tests/PublicTimetableReliability.test.tsx")
          reliability_test = reliability_test_path.read_text()
          eager_observer_assertion = '    expect(observerCallback).not.toBeNull();'
          stable_observer_assertion = '    await waitFor(() => expect(observerCallback).not.toBeNull());'
          if eager_observer_assertion in reliability_test:
              reliability_test = reliability_test.replace(
                  eager_observer_assertion,
                  stable_observer_assertion,
                  1,
              )
          elif stable_observer_assertion not in reliability_test:
              raise SystemExit("IntersectionObserver test assertion anchor missing")
          reliability_test_path.write_text(reliability_test)
          PY

      - name: Format touched files
        run: >-
          npx prettier --write
          src/pilotMvp.tsx
          src/FounderOperationsCockpit.tsx
          src/founderOperationsCockpit.css
          tests/founderOperationsCockpit.test.ts
          tests/App.test.tsx
          tests/PublicTimetableReliability.test.tsx

      - name: Remove one-shot workflow before final verification
        run: git rm .github/workflows/dr45-wire.yml

      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

      - name: Commit verified DR-45 integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: wire DR-45 founder operations cockpit"
          git push --force-with-lease origin HEAD:DR-45-founder-operations-cockpit
