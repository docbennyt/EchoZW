name: DR-42 finalize formatting

on:
  push:
    branches:
      - DR-42-apple-subscription-calendar-reliability

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DR-42-apple-subscription-calendar-reliability
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format DR-42 files
        run: |
          npx prettier --write \
            eslint.config.js \
            package.json \
            scripts/diagnose-calendar-feed.mjs \
            server/pilotCalendarApi.ts \
            server/publishedCalendar.ts \
            src/main.tsx \
            src/PublicTimetableReliability.tsx \
            src/publicTimetableReliability.css \
            src/domain/calendar.ts \
            src/domain/publishedCalendarProjection.ts \
            src/domain/subscriptions.ts \
            src/domain/timezone.ts \
            tests/PublicTimetableReliability.test.tsx \
            tests/dr42Timezone.test.ts \
            tests/pilotCalendarApiReliability.test.ts \
            tests/publishedCalendar.test.ts \
            docs/APPLE_CALENDAR_SETUP.md \
            docs/CALENDAR_PERSONALISATION.md \
            docs/CALENDAR_SYNC.md
      - name: Verify formatted branch before committing
        run: |
          npm run lint
          npm run format:check
          npm run test
          npm run build
      - name: Remove temporary helper and commit final formatting
        run: |
          rm .github/workflows/dr42-format-helper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore(DR-42): finalize verified calendar reliability changes"
          git push origin HEAD:DR-42-apple-subscription-calendar-reliability
