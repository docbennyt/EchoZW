name: Cloudflare Reviewed Staging

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full immutable candidate SHA approved by a reviewer
        required: true
        type: string
      pull_request:
        description: Pull request containing the approved candidate
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  authorize:
    if: github.ref == 'refs/heads/Calender'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify current candidate approval and CI
        id: authorize
        run: node scripts/authorize-staging-candidate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_PR: ${{ inputs.pull_request }}

  package:
    needs: authorize
    runs-on: ubuntu-latest
    services:
      delivery-postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dr178
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 15478:5432
        options: >-
          --health-cmd "pg_isready -U dr178 -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DR178_PG_MODULE: ${{ github.workspace }}/node_modules/pg/lib/index.js
      DR178_REQUIRE_POSTGRES: "true"
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.bundle.outputs.artifact-id }}
      artifact_digest: ${{ steps.bundle.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run worker:check
      - run: npm run worker:automation:check
      - run: npm run worker:validate
      - name: Bundle without deployment credentials
        run: npx wrangler@4.147.0 deploy --env staging --dry-run --outdir bundle
      - uses: actions/upload-artifact@v4
        id: bundle
        with:
          name: reviewed-worker-${{ needs.authorize.outputs.sha }}
          path: |
            bundle/index.js
            dist/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [authorize, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cloudflare-staging
    outputs:
      version: ${{ steps.deploy.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm ci --ignore-scripts
      - name: Recheck approval after environment review
        run: node scripts/authorize-staging-candidate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.authorize.outputs.sha }}
          CANDIDATE_PR: ${{ inputs.pull_request }}
      - name: Verify artifact identity and bytes
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > /tmp/reviewed-worker.zip
          python3 scripts/extract-staging-artifact.py /tmp/reviewed-worker.zip
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.package.outputs.artifact_digest }}
      - name: Prepare trusted deployment configuration
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/wrangler.jsonc?ref=$CANDIDATE_SHA" -H "Accept: application/vnd.github.raw+json" > /tmp/candidate-wrangler.jsonc
          node scripts/prepare-staging-deployment.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.authorize.outputs.sha }}
          CANDIDATE_CONFIG_PATH: /tmp/candidate-wrangler.jsonc
      - name: Deploy reviewed bundle
        id: deploy
        run: |
          set -o pipefail
          trap 'rm -f staging-canary-secrets.json' EXIT
          node scripts/prepare-staging-canary-secrets.mjs
          npx wrangler@4.147.0 deploy --config staging-deploy.json --env staging --no-bundle --secrets-file staging-canary-secrets.json --var SOURCE_SHA:$CANDIDATE_SHA --var SUPABASE_URL:$SUPABASE_URL --var VITE_SUPABASE_PUBLISHABLE_KEY:$VITE_SUPABASE_PUBLISHABLE_KEY | tee /tmp/reviewed-deploy.log
          node scripts/verify-active-worker-deployment.mjs
        env:
          CANDIDATE_SHA: ${{ needs.authorize.outputs.sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CALENDERZW_STAGING_GOOGLE_CANARY: ${{ secrets.CALENDERZW_STAGING_GOOGLE_CANARY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Verify deployed identity before acceptance
        id: identity
        run: node scripts/verify-staging-identity.mjs
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          EXPECTED_WORKER_VERSION: ${{ steps.deploy.outputs.version }}

  acceptance:
    needs: [authorize, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloudflare-staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Recheck review after acceptance approval
        run: node scripts/authorize-staging-candidate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.authorize.outputs.sha }}
          CANDIDATE_PR: ${{ inputs.pull_request }}
      - name: Verify approved deployment before releasing test credentials
        run: node scripts/verify-staging-identity.mjs
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          EXPECTED_WORKER_VERSION: ${{ needs.deploy.outputs.version }}
      - name: Authenticated and original-feed acceptance
        run: npm run worker:smoke:staging
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          EXPECTED_WORKER_VERSION: ${{ needs.deploy.outputs.version }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          CALENDERZW_STAGING_ADMIN_EMAIL: ${{ secrets.CALENDERZW_STAGING_ADMIN_EMAIL }}
          CALENDERZW_STAGING_ADMIN_PASSWORD: ${{ secrets.CALENDERZW_STAGING_ADMIN_PASSWORD }}
          CALENDERZW_STAGING_FEED_URL: ${{ secrets.CALENDERZW_STAGING_FEED_URL }}
          CALENDERZW_STAGING_FEED_TIMETABLE_SLUG: ${{ vars.CALENDERZW_STAGING_FEED_TIMETABLE_SLUG }}
      - run: npx playwright install --with-deps chromium
      - run: npm run browser:smoke:release
        env:
          CALENDERZW_BROWSER_SMOKE_BASE_URL: https://next.calender.aido.co.zw
