name: Cloudflare Staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref/SHA to deploy."
        required: true
        default: Calender
        type: string
      run_smoke:
        description: "Run live staging smoke after deploy."
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Verify and deploy staging Worker
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: cloudflare-staging
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CALENDERZW_STAGING_ORIGIN: https://next.calender.aido.co.zw
      CALENDERZW_STAGING_FEED_URL: ${{ secrets.CALENDERZW_STAGING_FEED_URL }}
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: npm

      - name: Confirm exact head
        id: exact-head
        run: |
          echo "event_sha=${GITHUB_SHA}"
          checked_out_sha="$(git rev-parse HEAD)"
          echo "checked_out_sha=${checked_out_sha}"
          echo "sha=${checked_out_sha}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Cloudflare foundation check
        run: npm run worker:check

      - name: Wrangler dry-run validation
        run: npx wrangler@4.147.0 deploy --env staging --config wrangler.jsonc --dry-run --outdir .wrangler-dry-run --var SOURCE_SHA:${{ steps.exact-head.outputs.sha }}

      - name: Deploy Cloudflare staging
        run: npx wrangler@4.147.0 deploy --env staging --config wrangler.jsonc --var SOURCE_SHA:${{ steps.exact-head.outputs.sha }} --tag sha-${{ steps.exact-head.outputs.sha }} --message "GitHub Actions ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Live staging smoke
        if: ${{ inputs.run_smoke }}
        run: npm run worker:smoke:staging
        env:
          EXPECTED_RELEASE_SHA: ${{ steps.exact-head.outputs.sha }}

      - name: Deployment evidence summary
        if: ${{ always() }}
        run: |
          {
            echo "## Cloudflare staging"
            echo
            echo "- Ref input: \`${{ inputs.ref }}\`"
            echo "- Exact SHA: \`${{ steps.exact-head.outputs.sha }}\`"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Smoke requested: \`${{ inputs.run_smoke }}\`"
            echo "- Production DNS unchanged by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
