name: DR-57 Apply

on:
  push:
    branches:
      - DR-57-class-rep-dashboard-ux

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DR-57-class-rep-dashboard-ux
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: python scripts/apply-dr57-dashboard.py
      - run: npm ci
      - name: Format DR-57 files
        run: >-
          npx prettier --write
          src/ClassRepCorrectionSafetyEnhancement.tsx
          src/classRepCorrectionSafetyEnhancement.css
          server/schemaCompatibility.ts
          tests/ClassRepCorrectionSafetyEnhancement.test.tsx
          tests/dr57SchemaReadiness.test.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ClassRepCorrectionSafetyEnhancement.tsx \
            src/classRepCorrectionSafetyEnhancement.css \
            server/schemaCompatibility.ts \
            tests/ClassRepCorrectionSafetyEnhancement.test.tsx \
            tests/dr57SchemaReadiness.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "DR-57: redesign Class Rep dashboard cockpit"
          git push origin HEAD:DR-57-class-rep-dashboard-ux
