name: DR-53 format once

on:
  push:
    branches:
      - DR-53-correction-idempotency-crud

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format DR-53 files
        run: npx prettier --write server/correctionsRepository.ts src/api/correctionMutations.ts src/ClassRepCorrectionSafetyEnhancement.tsx tests/ClassRepCorrectionSafetyEnhancement.test.tsx tests/correctionMutationHardeningMigration.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/correctionsRepository.ts src/api/correctionMutations.ts src/ClassRepCorrectionSafetyEnhancement.tsx tests/ClassRepCorrectionSafetyEnhancement.test.tsx tests/correctionMutationHardeningMigration.test.ts
          git commit -m "DR-53 apply Prettier formatting"
          git push origin HEAD:DR-53-correction-idempotency-crud
