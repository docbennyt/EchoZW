name: DR119 format

on:
  push:
    branches:
      - DR-119-vercel-railway-deployment

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DR-119-vercel-railway-deployment
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write docs/DEPLOYMENT_VERCEL_RAILWAY.md server/productionServer.ts tests/dr119DeploymentArchitecture.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEPLOYMENT_VERCEL_RAILWAY.md server/productionServer.ts tests/dr119DeploymentArchitecture.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(DR-119): apply prettier"
            git push origin HEAD:DR-119-vercel-railway-deployment
          fi
