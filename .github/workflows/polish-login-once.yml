name: Polish Base UI login once

on:
  push:
    branches:
      - Calender

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Calender
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Use Base UI in admin login
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("src/AppV2.tsx")
          text = path.read_text()
          marker = 'import { useEffect, useMemo, useState } from "react";'
          base_imports = 'import { Button as BaseButton } from "@base-ui/react/button";\nimport { Input as BaseInput } from "@base-ui/react/input";\n'
          if base_imports.strip() not in text:
            text = text.replace(marker, base_imports + marker, 1)

          match = re.search(
            r'function AdminLoginPage\(\) \{.*?\n\}\n\nfunction AdminPage',
            text,
            flags=re.S,
          )
          if not match:
            raise SystemExit("AdminLoginPage block not found")
          block = match.group(0)
          block = block.replace("<input", "<BaseInput")
          block = block.replace("<button", "<BaseButton")
          block = block.replace("</button>", "</BaseButton>")
          text = text[: match.start()] + block + text[match.end() :]
          path.write_text(text)
      - name: Format updated files
        run: npx prettier --write src/AppV2.tsx tests/brandConsistency.test.ts
      - name: Commit login and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppV2.tsx tests/brandConsistency.test.ts
          git commit -m "feat: use Base UI for admin login"
          git push origin HEAD:Calender
