name: DR-58 apply wiring

on:
  push:
    branches: [DR-58-academic-pause-calendar]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: DR-58-academic-pause-calendar
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply wiring script from finish harness
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/dr58-finish.yml').read_text()
          start = workflow.index("          python <<'PY'\n") + len("          python <<'PY'\n")
          end = workflow.index("\n          PY\n", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'dr58-wiring', 'exec'))
          PY
      - name: Remove one-shot workflows
        run: rm .github/workflows/dr58-finish.yml .github/workflows/dr58-apply.yml
      - name: Format repository
        run: npx prettier --write .
      - name: Commit applied wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finish DR-58 academic pause controls"
          git push origin HEAD:DR-58-academic-pause-calendar
