name: DR-53 build fix once

on:
  push:
    branches:
      - DR-53-correction-idempotency-crud

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply narrow TypeScript compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/ClassRepCorrectionSafetyEnhancement.tsx')
          text = path.read_text()
          text = text.replace('            editingCorrection.updatedAt,\n', '            editingCorrection.updatedAt ?? editingCorrection.createdAt,\n')
          text = text.replace('            editingException.updatedAt,\n', '            editingException.updatedAt ?? editingException.createdAt,\n')
          start_marker = '      const result =\n        entry.kind === "correction"'
          end_marker = '      const undo: UndoState = {'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = (
              '      let item: TimetableCorrectionDirective | TimetableSessionException;\n'
              '      if (entry.kind === "correction") {\n'
              '        const result = await revokeRecurringClassUpdate(\n'
              '          accessToken,\n'
              '          assignment.timetableId,\n'
              '          entry.item.id,\n'
              '        );\n'
              '        item = result.correction;\n'
              '      } else {\n'
              '        const result = await revokeSessionException(\n'
              '          accessToken,\n'
              '          assignment.timetableId,\n'
              '          entry.item.id,\n'
              '        );\n'
              '        item = result.exception;\n'
              '      }\n'
          )
          text = text[:start] + replacement + text[end:]
          text = text.replace('        updatedAt: item.updatedAt,\n', '        updatedAt: item.updatedAt ?? item.createdAt,\n')
          path.write_text(text)
          PY
      - name: Format changed files
        run: npx prettier --write src/ClassRepCorrectionSafetyEnhancement.tsx src/api/pilotTypes.ts src/api/correctionMutations.ts
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ClassRepCorrectionSafetyEnhancement.tsx src/api/pilotTypes.ts src/api/correctionMutations.ts
          git commit -m "DR-53 fix build type compatibility"
          git push origin HEAD:DR-53-correction-idempotency-crud
