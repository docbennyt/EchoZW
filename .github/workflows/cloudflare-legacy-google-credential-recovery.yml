name: Cloudflare Legacy Google Credential Recovery

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed application SHA already deployed on staging
        required: true
        type: string
      pull_request:
        description: Reviewed application pull request
        required: true
        type: string
      deployment_run:
        description: Successful protected staging deployment run
        required: true
        type: string
      mode:
        description: Read-only compatibility check or authenticated migration
        required: true
        type: choice
        options: [compatibility, migrate]
        default: compatibility
      key_source:
        description: Protected historical key candidate to test
        required: true
        type: choice
        options: [railway, historical2]
        default: railway

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: false

jobs:
  authorize:
    if: github.ref == 'refs/heads/Calender'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
    steps:
      - name: Reject non-compatibility use of historical2
        if: inputs.key_source == 'historical2' && inputs.mode != 'compatibility'
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify exact application approval and CI
        id: authorize
        run: node scripts/authorize-staging-candidate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_PR: ${{ inputs.pull_request }}

  recover:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.15.0
      - name: Recheck exact approval after environment policy
        run: node scripts/authorize-staging-candidate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.authorize.outputs.sha }}
          CANDIDATE_PR: ${{ inputs.pull_request }}
      - name: Recover reviewed deployment provenance
        id: provenance
        run: node scripts/recover-reviewed-worker.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.authorize.outputs.sha }}
          DEPLOYMENT_RUN: ${{ inputs.deployment_run }}
      - name: Verify active reviewed Worker
        id: current
        run: node scripts/verify-recovery-worker.mjs
        env:
          REVIEWED_WORKER_VERSION: ${{ steps.provenance.outputs.version }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify public release before credential access
        run: node scripts/verify-staging-identity.mjs
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          EXPECTED_WORKER_VERSION: ${{ steps.current.outputs.version }}
      - name: Run protected Railway-key compatibility or migration
        if: inputs.key_source == 'railway'
        run: node scripts/recover-legacy-google-credentials.mjs
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          EXPECTED_WORKER_VERSION: ${{ steps.current.outputs.version }}
          CREDENTIAL_RECOVERY_MODE: ${{ inputs.mode }}
          CREDENTIAL_RECOVERY_KEY_SOURCE: railway
          CALENDERZW_SELECTED_TOKEN_ENCRYPTION_KEY: ${{ secrets.CALENDERZW_LEGACY_TOKEN_ENCRYPTION_KEY }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          CALENDERZW_STAGING_ADMIN_EMAIL: ${{ secrets.CALENDERZW_STAGING_ADMIN_EMAIL }}
          CALENDERZW_STAGING_ADMIN_PASSWORD: ${{ secrets.CALENDERZW_STAGING_ADMIN_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Run protected second-historical-key compatibility
        if: inputs.key_source == 'historical2' && inputs.mode == 'compatibility'
        run: node scripts/recover-legacy-google-credentials.mjs
        env:
          EXPECTED_RELEASE_SHA: ${{ needs.authorize.outputs.sha }}
          EXPECTED_WORKER_VERSION: ${{ steps.current.outputs.version }}
          CREDENTIAL_RECOVERY_MODE: compatibility
          CREDENTIAL_RECOVERY_KEY_SOURCE: historical2
          CALENDERZW_SELECTED_TOKEN_ENCRYPTION_KEY: ${{ secrets.CALENDERZW_HISTORICAL_TOKEN_ENCRYPTION_KEY_2 }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          CALENDERZW_STAGING_ADMIN_EMAIL: ${{ secrets.CALENDERZW_STAGING_ADMIN_EMAIL }}
          CALENDERZW_STAGING_ADMIN_PASSWORD: ${{ secrets.CALENDERZW_STAGING_ADMIN_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Reject historical2 migration
        if: inputs.key_source == 'historical2' && inputs.mode != 'compatibility'
        run: exit 1
