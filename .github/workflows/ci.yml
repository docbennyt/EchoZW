name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Run tests with diagnostic capture
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee test-output.txt
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr54-test-output
          path: test-output.txt
          if-no-files-found: warn
      - run: npm run build
