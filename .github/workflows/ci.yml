name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply DR-54 test contract fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("tests/App.test.tsx")
          text = app.read_text()
          old_staff = '''  staff: {
            id: "staff-1",
            role: "superadmin",
            displayName: null,
            email: "admin@example.test",
          },'''
          new_staff = '''  staff: {
            id: "staff-1",
            role: "superadmin",
            isFounder: true,
            displayName: null,
            email: "admin@example.test",
          },'''
          old_permissions = '''  permissions: {
            canManageStaff: true,
            canManageInstitutions: true,
            canManageProgrammes: true,
            canManageClassGroups: true,
            canManageAllTimetables: true,
            canEditAssignedTimetables: true,
            canPublishAssignedTimetables: true,
          },'''
          new_permissions = '''  permissions: {
            canManageStaff: true,
            canManageAdmins: true,
            canManageClassReps: true,
            canManageInstitutions: true,
            canManageProgrammes: true,
            canManageClassGroups: true,
            canManageAcademicPeriods: true,
            canManageAllTimetables: true,
            canEditAllTimetables: true,
            canPublishAllTimetables: true,
            canManageSources: true,
            canViewOperationalAnalytics: true,
            canManageFounderAuthority: true,
            canEditAssignedTimetables: true,
            canPublishAssignedTimetables: true,
          },'''
          if old_staff not in text or old_permissions not in text:
              raise SystemExit("Expected App.test.tsx DR-53 fixture was not found")
          app.write_text(text.replace(old_staff, new_staff, 1).replace(old_permissions, new_permissions, 1))

          team = Path("tests/founderAdminTeamUi.test.ts")
          text = team.read_text()
          old_assertion = '''    expect(pilotMvp).toContain(
              "cannot change founder/superadmin authority.",
            );'''
          new_assertion = '''    expect(pilotMvp.replace(/\\s+/g, " ")).toContain(
              "Admin can manage CalenderZW operations and Class Reps, but cannot change founder/superadmin authority.",
            );'''
          if old_assertion not in text:
              raise SystemExit("Expected brittle founder copy assertion was not found")
          team.write_text(text.replace(old_assertion, new_assertion, 1))
          PY
      - run: npm run lint
      - run: npm run format:check
      - name: Run tests with diagnostic capture
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee test-output.txt
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr54-test-output
          path: test-output.txt
          if-no-files-found: warn
      - run: npm run build
      - name: Commit verified DR-54 test fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/App.test.tsx tests/founderAdminTeamUi.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "test: align admin fixtures with DR-54 session contract"
          git push origin HEAD:DR-54-founder-protected-admin
