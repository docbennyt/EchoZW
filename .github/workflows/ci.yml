name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: DR-54-founder-protected-admin
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply DR-54 test contract fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path("tests/App.test.tsx")
          text = app.read_text()

          text, founder_count = re.subn(
              r'(role: "superadmin",\n)(\s+)displayName: null,',
              lambda m: f'{m.group(1)}{m.group(2)}isFounder: true,\n{m.group(2)}displayName: null,',
              text,
              count=1,
          )
          if founder_count != 1:
              raise SystemExit(f"Expected one superadmin fixture, found {founder_count}")

          def insert_after_once(source: str, field: str, additions: list[str]) -> str:
              pattern = rf'(?m)^(\s+){re.escape(field)}: true,$'
              match = re.search(pattern, source)
              if not match:
                  raise SystemExit(f"Expected permission fixture field {field}")
              indent = match.group(1)
              block = match.group(0) + "\n" + "\n".join(
                  f"{indent}{addition}: true," for addition in additions
              )
              return source[: match.start()] + block + source[match.end() :]

          text = insert_after_once(text, "canManageStaff", ["canManageAdmins", "canManageClassReps"])
          text = insert_after_once(text, "canManageClassGroups", ["canManageAcademicPeriods"])
          text = insert_after_once(
              text,
              "canManageAllTimetables",
              [
                  "canEditAllTimetables",
                  "canPublishAllTimetables",
                  "canManageSources",
                  "canViewOperationalAnalytics",
                  "canManageFounderAuthority",
              ],
          )
          app.write_text(text)

          team = Path("tests/founderAdminTeamUi.test.ts")
          text = team.read_text()
          pattern = r'expect\(pilotMvp\)\.toContain\(\s*"cannot change founder/superadmin authority\.",\s*\);'
          replacement = '''expect(pilotMvp.replace(/\\s+/g, " ")).toContain(
                "Admin can manage CalenderZW operations and Class Reps, but cannot change founder/superadmin authority.",
              );'''
          text, assertion_count = re.subn(pattern, lambda _: replacement, text, count=1)
          if assertion_count != 1:
              raise SystemExit(f"Expected one brittle founder assertion, found {assertion_count}")
          team.write_text(text)
          PY
      - run: npm run lint
      - run: npm run format:check
      - name: Run tests with diagnostic capture
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee test-output.txt
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr54-test-output
          path: test-output.txt
          if-no-files-found: warn
      - run: npm run build
      - name: Commit verified DR-54 test fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/App.test.tsx tests/founderAdminTeamUi.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "test: align admin fixtures with DR-54 session contract"
          git push origin HEAD:DR-54-founder-protected-admin
