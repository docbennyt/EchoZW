name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Print formatted onboarding CSS
        run: |
          npx prettier --write src/studentOnboardingAcceleration.css
          echo "FORMATTED_CSS_BASE64=$(base64 -w0 src/studentOnboardingAcceleration.css)"
          exit 1
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
