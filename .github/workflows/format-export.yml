name: Format export

on:
  push:
    branches:
      - feature/production-ui-google-onboarding-polish

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-ui-google-onboarding-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/ProductionUxEnhancements.tsx src/productionUxEnhancements.css src/productionUxEnhancementsPatch.css
      - name: Commit formatted files if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ProductionUxEnhancements.tsx src/productionUxEnhancements.css src/productionUxEnhancementsPatch.css
          git commit -m "style: format production UX pass"
          git push origin HEAD:feature/production-ui-google-onboarding-polish
