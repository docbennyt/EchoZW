name: DR-58 verified core wiring

on:
  push:
    branches:
      - DR-58-academic-pause-calendar

permissions:
  contents: write

jobs:
  wire-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: DR-58-academic-pause-calendar
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wire pause rules into published timetable and calendar projection
        run: |
          python - <<'PY'
          from pathlib import Path

          pilot = Path('server/pilotRepository.ts')
          text = pilot.read_text()
          import_anchor = '} from "../src/api/pilotTypes.js";\n'
          pause_import = '''import {\n  listActiveAcademicPausesForTimetable,\n} from "./academicPauseRepository.js";\n'''
          if pause_import not in text:
              assert text.count(import_anchor) == 1
              text = text.replace(import_anchor, import_anchor + pause_import, 1)

          old_select = '"id, public_slug, current_published_version_id, institutions(name, timezone), programmes(name), cohorts(label), academic_periods(name, starts_on, ends_on)",'
          new_select = '"id, public_slug, current_published_version_id, institution_id, programme_id, cohort_id, institutions(name, short_name, timezone), programmes(name), cohorts(label), academic_periods(name, starts_on, ends_on)",'
          assert old_select in text
          text = text.replace(old_select, new_select, 1)

          period_anchor = '''  const period = asSingle(\n    timetableRecord.academic_periods as JsonRecord | JsonRecord[] | null,\n  );\n\n  return {\n'''
          period_replacement = '''  const period = asSingle(\n    timetableRecord.academic_periods as JsonRecord | JsonRecord[] | null,\n  );\n  const pauses = await listActiveAcademicPausesForTimetable({\n    timetableId: String(timetableRecord.id),\n    institutionId: String(timetableRecord.institution_id),\n    programmeId: String(timetableRecord.programme_id),\n    cohortId: String(timetableRecord.cohort_id),\n    startsOn: period?.starts_on ? String(period.starts_on) : null,\n    endsOn: period?.ends_on ? String(period.ends_on) : null,\n  });\n\n  return {\n'''
          assert period_anchor in text
          text = text.replace(period_anchor, period_replacement, 1)

          return_anchor = '''    exceptions: (exceptions ?? []).map((row: unknown) =>\n      mapPublicException(row as JsonRecord),\n    ),\n  } satisfies PublicTimetable;\n'''
          return_replacement = '''    exceptions: (exceptions ?? []).map((row: unknown) =>\n      mapPublicException(row as JsonRecord),\n    ),\n    pauses,\n  } satisfies PublicTimetable;\n'''
          assert return_anchor in text
          text = text.replace(return_anchor, return_replacement, 1)
          pilot.write_text(text)

          projection = Path('src/domain/publishedCalendarProjection.ts')
          text = projection.read_text()
          old_import = '''import {\n  resolveRecurringSessions,\n  resolveScheduleForDate,\n} from "./resolvedSchedule.js";\n'''
          new_import = '''import {\n  addDaysToDateKey,\n  resolveRecurringSessions,\n  resolveScheduleForDate,\n} from "./resolvedSchedule.js";\n'''
          assert old_import in text
          text = text.replace(old_import, new_import, 1)

          old_exdates = '''    const exDates = (timetable.exceptions ?? [])\n      .filter(\n        (exception) =>\n          exception.active &&\n          exception.stableSessionKey === session.stableSessionKey &&\n          (exception.exceptionType === "cancelled" ||\n            exception.exceptionType === "moved"),\n      )\n      .map((exception) => exception.exceptionDate)\n      .sort();\n'''
          new_exdates = '''    const exDates: string[] = [];\n    const recurrenceEndDate = timetable.endsOn as string;\n    for (\n      let occurrenceDate = firstDate;\n      occurrenceDate <= recurrenceEndDate;\n      occurrenceDate = addDaysToDateKey(occurrenceDate, 7)\n    ) {\n      const remainsActive = resolveScheduleForDate(\n        timetable,\n        occurrenceDate,\n      ).some(\n        (occurrence) =>\n          occurrence.recurring &&\n          occurrence.dateKey === occurrenceDate &&\n          occurrence.session.stableSessionKey === session.stableSessionKey,\n      );\n      if (!remainsActive) exDates.push(occurrenceDate);\n    }\n'''
          assert old_exdates in text
          text = text.replace(old_exdates, new_exdates, 1)
          projection.write_text(text)
          PY
      - name: Remove one-shot workflow before verification
        run: rm .github/workflows/dr58-core-wire.yml
      - run: npx prettier --write server/pilotRepository.ts src/domain/publishedCalendarProjection.ts server/academicPauseRepository.ts server/academicPauseAdminApi.ts src/domain/academicPause.ts src/domain/resolvedSchedule.ts src/api/academicPauses.ts src/api/pilotTypes.ts tests/academicPauseSchedule.test.ts tests/academicPauseMigration.test.ts server/adminApi.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
      - name: Commit verified core
        run: |
          git add -A
          git commit -m "feat: integrate DR-58 academic pause resolution"
          git push origin HEAD:DR-58-academic-pause-calendar
