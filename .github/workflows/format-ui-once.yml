name: Format CalenderZW UI once

on:
  push:
    branches:
      - Calender

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Calender
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format UI files
        run: >-
          npx prettier --write
          index.html
          public/data-deletion/index.html
          public/legal.css
          public/privacy/index.html
          public/support/index.html
          public/terms/index.html
          src/appV2.css
          src/AppV2.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Nothing to format."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html public/data-deletion/index.html public/legal.css public/privacy/index.html public/support/index.html public/terms/index.html src/appV2.css src/AppV2.tsx
          git commit -m "chore: format CalenderZW UI"
          git push origin HEAD:Calender
