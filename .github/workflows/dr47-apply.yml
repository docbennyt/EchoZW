name: DR-47 apply and verify

on:
  push:
    branches:
      - DR-47-class-viral-loop

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: DR-47-class-viral-loop

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply DR-47 implementation
        run: python scripts/dr47-apply.py

      - name: Remove one-shot implementation harness
        run: rm scripts/dr47-apply.py .github/workflows/dr47-apply.yml

      - name: Format changed source and tests
        run: |
          npx prettier --write \
            src/domain/shareAttribution.ts \
            src/domain/analytics.ts \
            src/PublicTimetableReliability.tsx \
            src/publicTimetableReliability.css \
            src/ClassRepCorrectionSafetyEnhancement.tsx \
            src/classRepCorrectionSafetyEnhancement.css \
            tests/shareAttribution.test.ts \
            tests/dr47ClassShare.test.tsx \
            tests/dr47ClassRepDistribution.test.ts

      - run: npm run format:check
      - run: npm run lint

      - name: Focused DR-47 regression suite
        run: npm run test -- tests/shareAttribution.test.ts tests/dr47ClassShare.test.tsx tests/dr47ClassRepDistribution.test.ts tests/PublicTimetableReliability.test.tsx tests/ClassRepCorrectionSafetyEnhancement.test.tsx tests/analyticsDomain.test.ts

      - run: npm run test
      - run: npm run build

      - name: Commit verified DR-47 tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add measurable class share loop"
          git push origin HEAD:DR-47-class-viral-loop
