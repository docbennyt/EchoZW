name: Format finder once

on:
  push:
    branches:
      - Calender

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Calender
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format finder files
        run: npx prettier --write src/FinderDiscovery.tsx src/finderDiscovery.css
      - name: Commit formatting
        run: |
          if git diff --quiet src/FinderDiscovery.tsx src/finderDiscovery.css; then
            echo "Finder files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/FinderDiscovery.tsx src/finderDiscovery.css
          git commit -m "style: format timetable directory"
          git push origin HEAD:Calender
